name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html/zoikobroadband-python

            git config --global --add safe.directory /var/www/html/zoikobroadband-python

            # Clean deploy
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # Ensure venv exists
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Upgrade pip inside venv
            /var/www/html/zoikobroadband-python/venv/bin/pip install --upgrade pip --quiet

            # Install deps
            /var/www/html/zoikobroadband-python/venv/bin/pip install -r requirements.txt --quiet

            # Django commands
            /var/www/html/zoikobroadband-python/venv/bin/python manage.py migrate --no-input
            /var/www/html/zoikobroadband-python/venv/bin/python manage.py collectstatic --no-input

            # Restart service
            sudo systemctl restart zoikobroadband-django