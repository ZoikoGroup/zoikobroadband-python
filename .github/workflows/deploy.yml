name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html/zoikobroadband-python

            # ✅ FIX ownership FIRST
            sudo chown -R lennox:lennox /var/www/html/zoikobroadband-python

            git config --global --add safe.directory /var/www/html/zoikobroadband-python

            # Clean deploy
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # ✅ Diagnostic: show every migration file that mentions 'currency'
            echo "--- grep for 'currency' in all migrations ---"
            grep -rn "currency" /var/www/html/zoikobroadband-python/*/migrations/ || echo "(none found)"
            echo "----------------------------------------------"

            # ✅ Broad patch: remove ANY RemoveField(name='currency') in ANY app migration
            /var/www/html/zoikobroadband-python/venv/bin/python - <<'PYEOF'
            import re, pathlib

            project_root = pathlib.Path("/var/www/html/zoikobroadband-python")

            # Match RemoveField for 'currency' with any model_name, any surrounding whitespace/comma
            pattern = re.compile(
                r",?\s*migrations\.RemoveField\(\s*"
                r"model_name\s*=\s*['\"][^'\"]+['\"],\s*"
                r"name\s*=\s*['\"]currency['\"],?\s*"
                r"\)",
                re.IGNORECASE | re.DOTALL
            )

            patched_any = False
            for migration_file in sorted(project_root.rglob("migrations/*.py")):
                src = migration_file.read_text()
                if "currency" not in src.lower():
                    continue
                print(f"Found 'currency' in: {migration_file.relative_to(project_root)}")
                patched, count = pattern.subn("", src)
                if count:
                    migration_file.write_text(patched)
                    print(f"  → Patched: removed {count} RemoveField('currency') block(s)")
                    patched_any = True
                else:
                    print(f"  → 'currency' present but no RemoveField block matched (check manually)")

            if not patched_any:
                print("Nothing patched.")
            PYEOF

            # Ensure venv exists
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Recreate if broken
            if [ ! -x "venv/bin/pip" ]; then
              echo "Recreating venv..."
              rm -rf venv
              python3 -m venv venv
            fi

            # Install deps
            /var/www/html/zoikobroadband-python/venv/bin/pip install --upgrade pip --quiet
            /var/www/html/zoikobroadband-python/venv/bin/pip install -r requirements.txt --quiet

            # Django
            /var/www/html/zoikobroadband-python/venv/bin/python manage.py migrate --fake-initial --no-input
            /var/www/html/zoikobroadband-python/venv/bin/python manage.py collectstatic --no-input

            # Restart
            sudo systemctl restart zoikobroadband-django