name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html/zoikobroadband-python

            # ✅ FIX ownership FIRST
            sudo chown -R lennox:lennox /var/www/html/zoikobroadband-python

            git config --global --add safe.directory /var/www/html/zoikobroadband-python

            # Clean deploy
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # ✅ Patch plans/0002 migration: remove the broken RemoveField('currency')
            #    that references a field which never existed in the DB.
            #    Runs after git pull so the patch survives every deploy.
            /var/www/html/zoikobroadband-python/venv/bin/python - <<'PYEOF'
            import re, pathlib, sys

            migration_dir = pathlib.Path("/var/www/html/zoikobroadband-python/plans/migrations")
            target = next(migration_dir.glob("0002_remove_planvariation_currency*.py"), None)

            if target is None:
                print("plans/0002 migration not found — skipping patch")
                sys.exit(0)

            src = target.read_text()

            # Remove the full migrations.RemoveField(...) block for 'currency'
            pattern = re.compile(
                r"\s*migrations\.RemoveField\(\s*"
                r"model_name=['\"]planvariation['\"],\s*"
                r"name=['\"]currency['\"],?\s*"
                r"\),",
                re.IGNORECASE
            )

            patched, count = pattern.subn("", src)

            if count:
                target.write_text(patched)
                print(f"Patched {target.name}: removed {count} RemoveField('currency') operation(s)")
            else:
                print(f"No patch needed in {target.name} (already clean)")
            PYEOF

            # Ensure venv exists
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Recreate if broken
            if [ ! -x "venv/bin/pip" ]; then
              echo "Recreating venv..."
              rm -rf venv
              python3 -m venv venv
            fi

            # Install deps
            /var/www/html/zoikobroadband-python/venv/bin/pip install --upgrade pip --quiet
            /var/www/html/zoikobroadband-python/venv/bin/pip install -r requirements.txt --quiet

            # Django
            /var/www/html/zoikobroadband-python/venv/bin/python manage.py migrate --fake-initial --no-input
            /var/www/html/zoikobroadband-python/venv/bin/python manage.py collectstatic --no-input

            # Restart
            sudo systemctl restart zoikobroadband-django