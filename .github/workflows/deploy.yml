name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html/zoikobroadband-python

            # ✅ FIX ownership FIRST
            sudo chown -R lennox:lennox /var/www/html/zoikobroadband-python

            git config --global --add safe.directory /var/www/html/zoikobroadband-python

            # Clean deploy
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # ✅ Patch ANY plans migration that contains RemoveField('currency')
            #    regardless of filename — the migration may have been renamed across PRs.
            /var/www/html/zoikobroadband-python/venv/bin/python - <<'PYEOF'
            import re, pathlib, sys

            migration_dir = pathlib.Path("/var/www/html/zoikobroadband-python/plans/migrations")

            pattern = re.compile(
                r"\s*migrations\.RemoveField\(\s*"
                r"model_name=['\"]planvariation['\"],\s*"
                r"name=['\"]currency['\"],?\s*"
                r"\),",
                re.IGNORECASE
            )

            patched_any = False
            for migration_file in sorted(migration_dir.glob("*.py")):
                src = migration_file.read_text()
                if "currency" not in src:
                    continue
                patched, count = pattern.subn("", src)
                if count:
                    migration_file.write_text(patched)
                    print(f"Patched {migration_file.name}: removed {count} RemoveField('currency') operation(s)")
                    patched_any = True

            if not patched_any:
                print("No RemoveField('currency') found in any plans migration — nothing to patch")
            PYEOF

            # Ensure venv exists
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Recreate if broken
            if [ ! -x "venv/bin/pip" ]; then
              echo "Recreating venv..."
              rm -rf venv
              python3 -m venv venv
            fi

            # Install deps
            /var/www/html/zoikobroadband-python/venv/bin/pip install --upgrade pip --quiet
            /var/www/html/zoikobroadband-python/venv/bin/pip install -r requirements.txt --quiet

            # Django
            /var/www/html/zoikobroadband-python/venv/bin/python manage.py migrate --fake-initial --no-input
            /var/www/html/zoikobroadband-python/venv/bin/python manage.py collectstatic --no-input

            # Restart
            sudo systemctl restart zoikobroadband-django